<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2. Change Background Color</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        input, button { padding: 8px; margin: 5px 3px; }
        button { cursor: pointer; }
        .message { margin-top: 12px; }
        table { border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #555; padding: 8px 12px; }
        
    </style>
</head>
<body>
<p id='paragraph'>Click a button to change my background color.</p>
<button onclick="changeColor('red')">Red</button>
<button onclick="changeColor('green')">Green</button>
<button onclick="changeColor('blue')">Blue</button>
<script>
function changeColor(color) {
    document.getElementById("paragraph").style.backgroundColor = color;
}
</script>
</body>
</html>
