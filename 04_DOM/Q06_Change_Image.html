<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q6. Change Image Using DOM</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        input, button { padding: 8px; margin: 5px 3px; }
        button { cursor: pointer; }
        .message { margin-top: 12px; }
        table { border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #555; padding: 8px 12px; }
        
    </style>
</head>
<body>
<h2>Cat and Dog Image</h2>
<img id='myImage' src='https://placehold.co/300x200?text=Cat' alt='Cat' width='300' height='200'>
<br><button onclick='changeImage()'>Change Image</button>
<p>Uses simple placeholder images labelled Cat and Dog.</p>
<script>
function changeImage() {
    let picture = document.getElementById("myImage");
    picture.src = "https://placehold.co/300x200?text=Dog";
    picture.alt = "Dog";
}
</script>
</body>
</html>
