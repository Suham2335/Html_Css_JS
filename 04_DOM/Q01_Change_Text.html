<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1. Change Text Using JavaScript</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        input, button { padding: 8px; margin: 5px 3px; }
        button { cursor: pointer; }
        .message { margin-top: 12px; }
        table { border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #555; padding: 8px 12px; }
        
    </style>
</head>
<body>
<h1 id='heading'>Welcome to My Website</h1>
<button onclick='changeText()'>Change Text</button>
<script>
function changeText() {
    document.getElementById("heading").textContent = "Welcome to JavaScript DOM!";
}
</script>
</body>
</html>
